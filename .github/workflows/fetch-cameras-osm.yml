name: Fetch camera data (OSM)

on:
  push:
    paths:
      - "nunppong-alert/tools/fetch_osm_trigger.txt"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nunppong-alert
    steps:
      - uses: actions/checkout@v4

      - name: Query Overpass (South Korea speed cameras)
        run: |
          cat > q.txt <<'Q'
          [out:json][timeout:180];
          area["ISO3166-1"="KR"][admin_level=2]->.a;
          (
            node["highway"="speed_camera"](area.a);
            node["enforcement"="maxspeed"](area.a);
          );
          out body;
          Q
          for url in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
            echo "trying $url"
            if curl -sS -m 200 --retry 2 -o osm.json --data-urlencode "data@q.txt" "$url" && python3 -c "import json;json.load(open('osm.json'))" 2>/dev/null; then
              echo "ok from $url"; break
            fi
          done
          ls -la osm.json
          python3 tools/osm_to_grid.py osm.json /tmp/cameras.grid.txt | tee stats.txt

      - name: Also probe official data portal reachability (log only)
        continue-on-error: true
        run: |
          curl -sS -m 30 -o /dev/null -w "data.go.kr standard page: %{http_code}\n" https://www.data.go.kr/data/15028200/standard.do || true

      - uses: actions/upload-artifact@v4
        with:
          name: osm-camera-data
          path: |
            nunppong-alert/osm.json
            nunppong-alert/stats.txt

      - name: Commit data if enough cameras and trigger APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(grep -o 'cameras=[0-9]*' stats.txt | cut -d= -f2)
          echo "cameras=$n"
          if [ "${n:-0}" -ge 300 ]; then
            cp /tmp/cameras.grid.txt app/src/main/assets/cameras.grid.txt
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add app/src/main/assets/cameras.grid.txt
            git commit -m "data: update camera DB from OpenStreetMap ($n cameras)" || exit 0
            git push
            gh workflow run android-debug.yml --ref "${GITHUB_REF_NAME}"
          else
            echo "too few cameras, not committing"
          fi
