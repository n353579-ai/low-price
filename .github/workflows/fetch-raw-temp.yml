name: Fetch raw camera csv (temp)
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: cd nunppong-alert && python3 tools/fetch_cameras.py /tmp/cameras.csv
      - uses: actions/upload-artifact@v4
        with:
          name: raw-cameras
          path: /tmp/cameras.csv
          retention-days: 1
