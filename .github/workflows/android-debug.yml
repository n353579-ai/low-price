name: Android debug APK

on:
  push:
    paths:
      - "nunppong-alert/**"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nunppong-alert
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # data/ 폴더에 공공데이터 CSV를 올려두면 빌드 때 자동으로 단속카메라 DB를 다시 만든다.
      - name: Convert camera CSV (if present)
        run: |
          shopt -s nullglob
          files=(data/*.csv)
          if [ ${#files[@]} -gt 0 ]; then
            python3 tools/convert_cameras.py "${files[0]}" app/src/main/assets/cameras.grid.txt
          else
            echo "no CSV in data/, using committed assets/cameras.grid.txt"
          fi

      - name: Unit tests + debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk nunppong-alert-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nunppong-alert-debug-apk
          path: nunppong-alert/nunppong-alert-debug.apk

      # 폰 브라우저에서 바로 받을 수 있도록 Release 에도 올린다 (Releases 탭 → 최신 항목)
      - name: Publish to Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: "debug build #${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: nunppong-alert/nunppong-alert-debug.apk
