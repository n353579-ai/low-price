name: Update camera data

on:
  schedule:
    - cron: "0 19 1 * *"   # 매월 2일 새벽(한국시간) 4시
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nunppong-alert
    steps:
      - uses: actions/checkout@v4

      - name: Fetch from data.go.kr
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 tools/fetch_cameras.py /tmp/cameras.csv

      - name: Convert (keep old file if result looks wrong)
        run: |
          old=$(grep -c '^C ' app/src/main/assets/cameras.grid.txt || true)
          python3 tools/convert_cameras.py /tmp/cameras.csv /tmp/new.grid.txt
          new=$(grep -c '^C ' /tmp/new.grid.txt || true)
          echo "old=$old new=$new"
          if [ "$new" -lt $((old * 9 / 10)) ]; then
            echo "새 데이터가 기존의 90% 미만이라 교체하지 않습니다"; exit 1
          fi
          # 카메라마다 '카메라 앞 도로 선'을 OpenStreetMap 에서 뽑아 붙인다 (앱이 도로 위에 있는지 판단하는 데 씀)
          pip install --quiet osmium numpy
          curl -sSL --fail -o /tmp/korea.osm.pbf https://download.geofabrik.de/asia/south-korea-latest.osm.pbf
          python3 tools/build_paths.py /tmp/korea.osm.pbf /tmp/new.grid.txt --csv=/tmp/cameras.csv
          withpath=$(awk '/^C /{c=1} /^P /{if(c){n++; c=0}} END{print n+0}' /tmp/new.grid.txt)
          echo "cameras with road line=$withpath"
          if [ "$withpath" -lt $((new * 9 / 10)) ]; then
            echo "도로 선이 붙은 카메라가 90% 미만이라 교체하지 않습니다"; exit 1
          fi
          # 사람이 확인한 제한속도 수정을 덮어쓴다 (data/limit_fixes.csv)
          python3 tools/apply_fixes.py /tmp/new.grid.txt data/limit_fixes.csv
          cp /tmp/new.grid.txt app/src/main/assets/cameras.grid.txt
          # 수동 CSV가 남아 있으면 빌드가 옛 CSV로 덮어쓰므로 지운다
          git rm -q --ignore-unmatch data/*.csv || true

      - name: Commit if changed
        run: |
          git config user.name "camera-data-bot"
          git config user.email "camera-data-bot@users.noreply.github.com"
          git add -A app/src/main/assets data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "Update camera data from data.go.kr"
          git push
